name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  # pydantic-core has no wheel for the newest interpreter on the runner; keep
  # CI on the Python the project targets.
  UV_PYTHON: "3.14"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true

      - name: Run test suite
        run: uv run pytest -q

      - name: Build package
        run: uv build

  toolchains:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check toolchain versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .agents/standards/toolchains/scripts/check_toolchain_versions.py
